<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Equipment Recognition</title>
  <style>
    body {
      max-width: 640px; margin: 24px auto; padding: 16px;
      font-family: system-ui, sans-serif;
    }
    video { width: 100%; background: #111; border-radius: 12px; }
    button { padding: 12px 20px; margin: 12px 8px 12px 0; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Lab Equipment Recognition</h1>
  <video id="camera" autoplay muted playsinline></video>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <h2 id="equipment">Camera stopped</h2>
  <p id="status"></p>

  <script>
    const video = document.querySelector("#camera");
    const start = document.querySelector("#start");
    const stop = document.querySelector("#stop");
    const equipment = document.querySelector("#equipment");
    const status = document.querySelector("#status");
    const canvas = document.createElement("canvas");

    const allowed = new Set([
      "digital oscilloscope", "multimeter", "breadboard", "transistor"
    ]);

    let running = false;
    let stream;
    let controller;

    // Read detection objects from nested Workflow JSON.
    function detectedNames(result) {
      const names = new Set();

      function walk(value) {
        if (!value || typeof value !== "object") return;
        if (Array.isArray(value)) {
          value.forEach(walk);
          return;
        }

        if (
          typeof value.class === "string" &&
          allowed.has(value.class) &&
          typeof value.x === "number" &&
          typeof value.width === "number"
        ) {
          names.add(value.class);
        }

        Object.values(value).forEach(walk);
      }

      walk(result.outputs ?? result);
      return [...names];
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function recognizeLoop() {
      while (running) {
        const started = performance.now();

        try {
          if (!video.videoWidth || !video.videoHeight) {
            await sleep(200);
            continue;
          }

          canvas.width = Math.min(960, video.videoWidth);
          canvas.height = Math.round(
            video.videoHeight * canvas.width / video.videoWidth
          );
          canvas.getContext("2d").drawImage(
            video, 0, 0, canvas.width, canvas.height
          );

          const image = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
          controller = new AbortController();

          const response = await fetch("/.netlify/functions/recognize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image }),
            signal: controller.signal
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || `HTTP ${response.status}`);
          }
          if (!running) break;

          console.log("Roboflow response:", result);
          const names = detectedNames(result);

          equipment.textContent = names.length
            ? names.join(", ")
            : "No target equipment detected";

          status.textContent =
            "Category recognition only. Check the device manual before use.";

          // Connect your verified information-card lookup here:
          // showEquipmentCard(names[0] ?? null);
        } catch (error) {
          if (!running) break;
          equipment.textContent = "Recognition paused";
          status.textContent = error.message;
          // Avoid repeatedly sending requests after a server error.
          stopCamera();
          break;
        }

        await sleep(Math.max(0, 1000 - (performance.now() - started)));
      }
    }

    function stopCamera() {
      running = false;
      controller?.abort();
      stream?.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      start.disabled = false;
      stop.disabled = true;
    }

    start.onclick = async () => {
      start.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        running = true;
        stop.disabled = false;
        status.textContent = "Recognizing…";
        recognizeLoop();
      } catch (error) {
        stopCamera();
        status.textContent = error.message;
      }
    };

    stop.onclick = () => {
      stopCamera();
      equipment.textContent = "Camera stopped";
      status.textContent = "";
    };

    // Stop sending frames when the page is hidden.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stop.onclick();
    });
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
